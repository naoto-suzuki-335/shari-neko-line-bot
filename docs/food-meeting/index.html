<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wikimedia Commonsの料理画像を題材に、しゃりねこと食事方針をゆるく審議する娯楽ページです。">
  <title>しゃりねこ 食前経営会議</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fff8ef;
      --surface: #fffdf9;
      --text: #382b24;
      --muted: #705f55;
      --accent: #9b432d;
      --accent-dark: #76301f;
      --border: #ead5c1;
      --shadow: 0 12px 30px rgba(77, 46, 29, 0.11);
    }

    * { box-sizing: border-box; }
    html { overflow-wrap: anywhere; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }
    main {
      width: min(880px, 100%);
      margin: 0 auto;
      padding: 44px max(18px, env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    .back-link, .source a, .metadata a { color: var(--accent-dark); }
    .back-link:focus-visible, select:focus-visible, button:focus-visible, .source a:focus-visible, .metadata a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }
    header { margin: 26px 0 28px; text-align: center; }
    h1 { margin: 0; color: var(--accent); font-size: clamp(1.8rem, 5vw, 2.7rem); line-height: 1.35; }
    .intro { margin: 10px 0 0; color: var(--muted); }
    .panel { padding: 26px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    label { font-weight: 700; }
    select, button { min-height: 44px; font: inherit; }
    select { max-width: 100%; padding: 8px 38px 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text); }
    .status { min-height: 1.7em; margin: 18px 0 0; color: var(--muted); }
    .display[hidden], .retry[hidden], .dynamic-link[hidden] { display: none; }
    .image-slot { display: grid; min-height: 260px; margin-top: 18px; place-items: center; border-radius: 16px; background: #f4eadf; overflow: hidden; }
    .image-slot:empty { display: none; }
    .image-slot img { display: block; width: 100%; max-height: 560px; object-fit: contain; }
    .candidate-title { margin: 22px 0 6px; color: var(--accent); font-size: clamp(1.35rem, 4vw, 1.8rem); }
    .comment { margin: 0 0 18px; font-weight: 700; }
    .metadata { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 14px; margin: 0; }
    .metadata dt { color: var(--muted); }
    .metadata dd { margin: 0; }
    .decision-result { min-height: 1.7em; margin: 20px 0 0; font-weight: 700; }
    .button-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    button { padding: 9px 14px; border: 1px solid var(--accent); border-radius: 11px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
    button.secondary { background: #fff; color: var(--accent-dark); }
    button:disabled { cursor: default; opacity: 0.55; }
    .retry { margin-top: 12px; }
    .source { margin: 22px 0 0; color: var(--muted); font-size: 0.92rem; }
    .noscript { margin-top: 16px; color: var(--muted); }
    @media (max-width: 760px) { main { padding-top: 32px; } .panel { padding: 22px; } }
    @media (max-width: 520px) { .panel { padding: 18px; } .button-group { grid-template-columns: 1fr; } .image-slot { min-height: 210px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <a class="back-link" href="../home/">← しゃりねこ案内所へ戻る</a>
    <header>
      <h1>しゃりねこ 食前経営会議</h1>
      <p class="intro">本日の食事方針を、ゆるく審議します。</p>
    </header>

    <section class="panel" id="food-meeting-panel" aria-label="食前経営会議">
      <div class="controls">
        <label for="food-meeting-theme">議題を選ぶ</label>
        <select id="food-meeting-theme">
          <option value="rice" selected>ごはん</option>
          <option value="bread">パン</option>
          <option value="noodles">麺</option>
          <option value="soup">スープ</option>
          <option value="vegetable">野菜料理</option>
          <option value="dessert">甘味</option>
        </select>
      </div>

      <p class="status" id="food-meeting-status" aria-live="polite">会議資料を確認しています…</p>
      <div class="display" id="food-meeting-display" hidden>
        <div class="image-slot" id="food-meeting-image-slot"></div>
        <h2 class="candidate-title" id="food-meeting-label"></h2>
        <p class="comment" id="food-meeting-comment"></p>
        <dl class="metadata">
          <dt>作者</dt><dd id="food-meeting-artist"></dd>
          <dt>Credit</dt><dd id="food-meeting-credit"></dd>
          <dt>ライセンス</dt><dd><a class="dynamic-link" id="food-meeting-license" hidden></a></dd>
          <dt>公式ページ</dt><dd><a class="dynamic-link" id="food-meeting-file-link" hidden>Wikimedia Commonsで確認する</a></dd>
        </dl>
        <p class="decision-result" id="food-meeting-decision-result" aria-live="polite"></p>
      </div>

      <div class="button-group" aria-label="決裁操作">
        <button id="food-meeting-approve-small" type="button" disabled>小盛りで承認</button>
        <button id="food-meeting-adopt" type="button" disabled>本日の候補にする</button>
        <button id="food-meeting-view-only" type="button" disabled>見るだけで終了</button>
        <button class="secondary" id="food-meeting-reconsider" type="button" disabled>再審議</button>
      </div>
      <button class="retry" id="food-meeting-retry" type="button" hidden disabled>もう一度確認</button>
      <p class="source" id="food-meeting-attribution">Images and data provided via <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a></p>
      <noscript><p class="noscript">食前経営会議の表示にはJavaScriptが必要です。</p></noscript>
    </section>
  </main>
  <script src="./food-meeting.js?v=1" defer></script>
</body>
</html>
