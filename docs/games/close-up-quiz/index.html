<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="拡大されたしゃりねこの画像から、どの動画かを3択で当てるクイズです。">
  <title>しゃりねこ どアップクイズ</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fff9f0;
      --surface: #fffdfb;
      --surface-soft: #fff4e7;
      --text: #382b24;
      --muted: #705f55;
      --accent: #a3482d;
      --accent-dark: #71321f;
      --border: #ead7c7;
      --correct: #3f6d2d;
      --correct-soft: #edf6e8;
      --incorrect: #8c3528;
      --incorrect-soft: #fff0ec;
      --focus: #1769aa;
      --shadow: 0 10px 28px rgba(77, 46, 29, 0.09);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      overflow-wrap: anywhere;
    }

    body {
      min-width: 0;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    [hidden] {
      display: none !important;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding:
        max(32px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(48px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      color: var(--accent);
      font-size: clamp(1.9rem, 7vw, 2.8rem);
      line-height: 1.3;
    }

    .intro {
      margin-bottom: 0;
      color: var(--muted);
    }

    .game-panel {
      padding: clamp(16px, 5vw, 28px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .game-status {
      margin-bottom: 14px;
      color: var(--muted);
      font-weight: 700;
    }

    .question-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
    }

    .question-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1);
      transition: transform 240ms ease;
    }

    .question-image.is-zoomed {
      transform: scale(2);
    }

    .choices {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .choice-button,
    .next-button,
    .retry-button,
    .video-link {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-weight: 800;
    }

    .choice-button,
    .next-button,
    .retry-button {
      width: 100%;
      padding: 10px 18px;
      cursor: pointer;
    }

    .choice-button {
      border: 2px solid var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .choice-button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .choice-button.is-correct {
      border-color: var(--correct);
      background: var(--correct-soft);
      color: var(--correct);
    }

    .choice-button.is-incorrect {
      border-color: var(--incorrect);
      background: var(--incorrect-soft);
      color: var(--incorrect);
    }

    .choice-button:disabled {
      cursor: default;
      opacity: 1;
    }

    .choice-button:focus-visible,
    .next-button:focus-visible,
    .retry-button:focus-visible,
    .video-link:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .result-panel {
      margin-top: 20px;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: var(--surface-soft);
      text-align: center;
    }

    .result-panel.is-correct {
      border-color: var(--correct);
      background: var(--correct-soft);
    }

    .result-panel.is-incorrect {
      border-color: var(--incorrect);
      background: var(--incorrect-soft);
    }

    .result-heading {
      margin-bottom: 6px;
      font-size: 1.25rem;
    }

    .result-message,
    .answer-name {
      margin-bottom: 8px;
    }

    .answer-name {
      font-weight: 800;
    }

    .result-actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .video-link {
      padding: 10px 18px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
    }

    .next-button {
      border: 2px solid var(--accent);
      background: #ffffff;
      color: var(--accent-dark);
    }

    .retry-button {
      margin-top: 12px;
      border: 2px solid var(--accent);
      background: #ffffff;
      color: var(--accent-dark);
    }

    .error-message,
    noscript p {
      margin: 18px 0 0;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff7ed;
      color: var(--incorrect);
      font-weight: 700;
    }

    @media (min-width: 620px) {
      .choices {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .result-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .question-image {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>しゃりねこ どアップクイズ</h1>
      <p class="intro">どの動画のしゃりねこか、3つの答えから選んでください。</p>
    </header>

    <section class="game-panel" aria-labelledby="close-up-quiz-heading">
      <h2 id="close-up-quiz-heading" hidden>クイズ</h2>

      <p class="game-status" data-close-up-status aria-live="polite" aria-atomic="true">
        問題を準備しています。
      </p>

      <div class="question-frame" data-close-up-frame aria-busy="true">
        <img class="question-image" data-close-up-image alt="どの動画のしゃりねこでしょう？">
      </div>

      <div class="choices" data-close-up-choices aria-label="回答の選択肢"></div>

      <section
        class="result-panel"
        data-close-up-result
        aria-labelledby="close-up-result-heading"
        aria-live="polite"
        aria-atomic="true"
        hidden
      >
        <h2 id="close-up-result-heading" class="result-heading" data-close-up-result-heading tabindex="-1">結果</h2>
        <p class="result-message" data-close-up-result-message></p>
        <p class="answer-name">正解：<span data-close-up-answer-name></span></p>
        <div class="result-actions">
          <a class="video-link" data-close-up-video-link href="">この動画を見る</a>
          <button class="next-button" type="button" data-close-up-next>もう一問</button>
        </div>
      </section>

      <p class="error-message" data-close-up-error role="alert" hidden></p>
      <button class="retry-button" type="button" data-close-up-retry hidden disabled>もう一度試す</button>

      <noscript>
        <p>このゲームを遊ぶにはJavaScriptを有効にしてください。</p>
      </noscript>
    </section>
  </main>

  <script src="./close-up-quiz.js?v=1" defer></script>
</body>
</html>
