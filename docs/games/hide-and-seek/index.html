<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="行・列・色エリアに1匹ずつ、しゃりねこを隠すロジックパズルです。">
  <title>しゃりねこ かくれマス</title>
  <style>
    :root { color-scheme: light; --bg:#fff9f0; --surface:#fffdfb; --text:#382b24; --muted:#705f55; --accent:#a3482d; --area-border:#60483a; --cell-border:#cdb9a9; --danger:#a94b3d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; }
    button { font:inherit; color:inherit; -webkit-appearance:none; appearance:none; touch-action:manipulation; }
    [hidden] { display:none !important; }
    main { width:min(100%,720px); margin:0 auto; padding:20px 12px 36px; }
    header { text-align:center; margin-bottom:14px; }
    h1 { margin:0; color:var(--accent); font-size:clamp(1.8rem,7vw,3rem); line-height:1.25; }
    .intro { margin:8px 0 0; color:var(--muted); }
    .panel { width:100%; max-width:640px; margin:0 auto; padding:clamp(12px,3vw,20px); border:1px solid #ead7c7; border-radius:20px; background:var(--surface); box-shadow:0 10px 28px rgba(77,46,29,.09); }
    .rules { margin:0 0 14px; padding-left:1.3em; color:var(--muted); font-size:.94rem; }
    .mode-switch { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    .mode-button,.reset-button,.alternate-button { min-height:44px; border:2px solid #d7bba5; border-radius:999px; background:#fff; font-weight:700; cursor:pointer; }
    .mode-button[aria-pressed="true"] { border-color:var(--accent); background:#f4dfca; color:#71321f; }
    .mode-button:focus-visible,.reset-button:focus-visible,.alternate-button:focus-visible,.cell:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .board-heading { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:6px; }
    h2 { margin:0; font-size:1.15rem; }
    .count { margin:0; color:var(--muted); font-size:.9rem; }
    .operation { margin:0 0 10px; color:var(--muted); font-size:.88rem; }
    .board { display:grid; width:100%; max-width:480px; margin:0 auto; overflow:hidden; border:3px solid var(--area-border); background:var(--cell-border); gap:0; }
    .cell { position:relative; display:grid; place-items:center; min-width:0; aspect-ratio:1; padding:2px; border:0; border-top:1px solid var(--cell-border); border-left:1px solid var(--cell-border); background:var(--cell-color); cursor:pointer; font-weight:800; font-size:clamp(1rem,5vw,1.65rem); line-height:1; }
    .cell.is-first-row { border-top:0; }
    .cell.is-first-column { border-left:0; }
    .cell.has-area-boundary-top { border-top:3px solid var(--area-border); }
    .cell.has-area-boundary-left { border-left:3px solid var(--area-border); }
    .cell.is-conflict { outline:2px dashed var(--danger); outline-offset:-6px; }
    .cell.is-conflict::after { position:absolute; inset:7px; border-radius:50%; background:rgba(255,255,255,.28); content:""; pointer-events:none; }
    .mark { position:relative; z-index:1; }
    .cat-mark { width:58%; aspect-ratio:1; border-radius:50% 50% 44% 44%; background:#71321f; }
    .cat-mark::before,.cat-mark::after { position:absolute; top:-13%; width:42%; height:42%; background:#71321f; content:""; transform:rotate(45deg); border-radius:15%; }
    .cat-mark::before { left:4%; } .cat-mark::after { right:4%; }
    .face { display:block; position:relative; z-index:2; width:100%; height:100%; object-fit:contain; animation:face-in 240ms ease-out; }
    .status { min-height:1.6em; margin:12px 0 0; color:var(--muted); text-align:center; font-weight:700; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px; }
    .reset-button { padding:8px 22px; border-color:var(--accent); background:var(--accent); color:#fff; }
    .alternate-button { padding:8px 22px; border-color:var(--accent); color:var(--accent); }
    .completion { margin-top:16px; padding:13px; border:2px solid #9aaa78; border-radius:14px; background:#edf2df; text-align:center; animation:complete-in 260ms ease-out; }
    .completion p { margin:0; font-weight:800; }
    .completion p + p { margin-top:2px; font-weight:600; }
    @keyframes face-in { from { opacity:0; } to { opacity:1; } }
    @keyframes complete-in { from { opacity:0; background:#fffdfb; } to { opacity:1; background:#edf2df; } }
    @media (hover:hover) and (pointer:fine) { .cell:hover { filter:brightness(.97); } .mode-button:hover,.reset-button:hover,.alternate-button:hover { filter:brightness(.96); } }
    @media (max-width:600px) { main { padding:24px 8px 40px; } header { margin-bottom:18px; } .panel { max-width:none; padding:12px 8px 16px; } .board { max-width:none; } }
    @media (max-width:360px) { .actions { flex-direction:column; } .reset-button,.alternate-button { width:100%; } }
    @media (prefers-reduced-motion:reduce) { .face,.completion { animation:none; } }
  </style>
</head>
<body>
  <main>
    <header><h1>しゃりねこ かくれマス</h1><p class="intro">区切られたエリアを手がかりに、しゃりねこの居場所を見つけましょう。</p></header>
    <section class="panel" aria-labelledby="game-heading">
      <h2 id="game-heading" hidden>ゲーム盤面</h2>
      <ul class="rules"><li>各行・各列・各エリアに、しゃりねこは1匹</li><li>しゃりねこ同士は、斜めを含めて隣り合いません</li></ul>
      <div class="mode-switch" aria-label="問題を選ぶ">
        <button class="mode-button" type="button" data-puzzle="practice" aria-pressed="true">練習 5×5</button>
        <button class="mode-button" type="button" data-puzzle="main" aria-pressed="false">本番 8×8</button>
      </div>
      <div class="board-heading"><h2 data-puzzle-title>練習問題</h2><p class="count" data-cat-count>0 / 5匹</p></div>
      <p class="operation">マスをタップ：空欄 → × → ねこ印 → 空欄</p>
      <p class="status" data-status role="status" aria-live="polite" aria-atomic="true">盤面を準備しています。</p>
      <div class="board" data-board role="grid" aria-label="練習問題 5かける5" aria-busy="true"></div>
      <div class="actions"><button class="reset-button" type="button" data-reset>やり直す</button><button class="alternate-button" type="button" data-alternate>別の配置</button></div>
      <div class="completion" data-completion role="status" aria-live="polite" aria-atomic="true" hidden><p data-completion-count></p><p>みんな別の顔をしています。</p></div>
      <noscript><p>このゲームを遊ぶにはJavaScriptを有効にしてください。</p></noscript>
    </section>
  </main>
  <script src="./hide-and-seek.js?v=1" defer></script>
</body>
</html>
