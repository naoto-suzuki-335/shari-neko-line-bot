<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="しゃりねこの動画図鑑、お酒の小話、季節の特集をご案内します。">
  <title>しゃりねこ案内所</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fff9f0;
      --surface: #fffdfb;
      --text: #382b24;
      --muted: #705f55;
      --accent: #a3482d;
      --border: #ead7c7;
      --shadow: 0 10px 28px rgba(77, 46, 29, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      overflow-wrap: anywhere;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      line-height: 1.3;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .guide-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .guide-card {
      height: 100%;
    }

    .guide-link {
      display: flex;
      min-height: 180px;
      height: 100%;
      flex-direction: column;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
    }

    .guide-link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 14px 32px rgba(77, 46, 29, 0.13);
    }

    .guide-link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .guide-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .guide-title {
      margin: 18px 0 8px;
      color: var(--accent);
      font-size: 1.2rem;
      line-height: 1.4;
    }

    .guide-description {
      margin: 0;
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .guide-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 32px 14px 48px;
      }

      header {
        margin-bottom: 24px;
      }

      .guide-list {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .guide-link {
        min-height: 44px;
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .guide-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>しゃりねこ案内所</h1>
      <p class="intro">今日は、どの棚をのぞきますか？🐱</p>
    </header>

    <nav aria-label="しゃりねこのコンテンツ案内">
      <ul class="guide-list">
        <li class="guide-card">
          <a class="guide-link" href="../videos/">
            <span class="guide-icon" aria-hidden="true">🎬</span>
            <span class="guide-title">しゃりねこ動画図鑑</span>
            <span class="guide-description">55作品から、気になる動画を探せます。</span>
          </a>
        </li>
        <li class="guide-card">
          <a class="guide-link" href="../sake/">
            <span class="guide-icon" aria-hidden="true">🍷</span>
            <span class="guide-title">お酒の小話</span>
            <span class="guide-description">日本酒・ワイン・ビールなどの小話を楽しめます。</span>
          </a>
        </li>
        <li class="guide-card">
          <a class="guide-link" href="../videos/halloween/">
            <span class="guide-icon" aria-hidden="true">🎃</span>
            <span class="guide-title">季節の特集</span>
            <span class="guide-description">ただいま、ハロウィン特集を公開中です。</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
